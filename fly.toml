app = "cleanmind-api-germannaz"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npx prisma migrate deploy"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_NAME = "CleanMind"
  BREVO_API_URL = "https://api.brevo.com/v3"
  BREVO_TIMEOUT_MS = "10000"
  MAIL_FROM = "germannaz_@hotmail.com"
  MAIL_FROM_NAME = "CleanMind"
  SUPPORT_EMAIL = "germannaz_@hotmail.com"
  MFA_ISSUER = "CleanMind"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
